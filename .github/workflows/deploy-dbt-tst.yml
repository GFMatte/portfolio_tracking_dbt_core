name: Deploy dbt to TST

on:
  push:
    branches:
      - main

jobs:
  deploy-tst:
    runs-on: ubuntu-latest

    env:
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt Snowflake
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake

      - name: Check dbt connection
        run: dbt debug --target tst

      - name: Install dbt packages
        run: dbt deps --target tst

      - name: Build dbt project in TST
        run: dbt build --target tst